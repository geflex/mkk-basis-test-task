[project]
name = "payments-mkk"
version = "1.0.0"
description = "Асинхронная обработка платежей с транзакционным outbox, повторами и dead letter queue."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "asyncpg>=0.29,<1.0",
    "alembic>=1.13,<2.0",
    "faststream[rabbit,cli]>=0.7,<0.8",
    "httpx>=0.27,<1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<10",
    "pytest-asyncio>=0.23,<2",
    "httpx>=0.27,<1",
    "testcontainers[postgres,rabbitmq]>=4,<5",
]

[tool.uv]
package = false